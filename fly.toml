app = 'courier-social'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "8080"
  JETSTREAM_URL = "wss://jetstream2.us-east.bsky.network/subscribe"
  SPACEDUST_URL = "wss://spacedust.microcosm.blue/subscribe"
  BSKY_API_URL = "https://public.api.bsky.app"
  USE_SPACEDUST = "true"
  APNS_BUNDLE_ID = "social.courier.app"
